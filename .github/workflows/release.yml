name: Release

# Publishes the binaries that install.sh and install.ps1 download. Asset names
# are the contract between this workflow and the installers: renaming one here
# means renaming it there too.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl is linked statically, so one Linux binary runs on every
          # distribution regardless of its glibc version.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.archive == 'tar.gz'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        if: matrix.archive == 'tar.gz'
        run: |
          name="system-administration-${{ matrix.target }}"
          tar -czf "$name.tar.gz" \
            -C "target/${{ matrix.target }}/release" system-administration
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "system-administration-${{ matrix.target }}"
          Compress-Archive -Force `
            -Path "target/${{ matrix.target }}/release/system-administration.exe" `
            -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            system-administration-*.tar.gz
            system-administration-*.zip
            system-administration-*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
